      <div id="playersPanel" class="panel">
        <div class="row" style="margin-bottom:12px">
          <button class="btn btn-start" onclick="loadPlayers()">Refresh</button>
          <input id="playersSearch" placeholder="Search players..." style="width:240px;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif" oninput="renderPlayers()">
          <span class="status-text" id="playersStatus"></span>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr>
              <th>ID</th>
              <th>Nickname</th>
              <th>Login</th>
              <th>Email</th>
              <th>Last IP</th>
              <th>Status</th>
              <th>Created</th>
              <th>Bans</th>
              <th>Actions</th>
            </tr></thead>
            <tbody id="playersBody"></tbody>
          </table>
        </div>
      </div>
