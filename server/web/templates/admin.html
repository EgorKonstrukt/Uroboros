<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uroboros Admin</title>
<link rel="stylesheet" href="/admin/static/admin.css?v=2">
</head>
<body>
<div id="toast"></div>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">U</div>
      <div class="brand-text">
        <span class="brand-name">Uroboros</span>
        <span class="brand-desc">Project Control</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">GENERAL</div>
      <button class="nav-item active" data-tab="projects" onclick="switchTab('projects')">Projects</button>
      <button class="nav-item" data-tab="players" onclick="switchTab('players')">Players</button>
      <button class="nav-item" data-tab="config" onclick="switchTab('config')">Config</button>
      <button class="nav-item" data-tab="java" onclick="switchTab('java')">Java</button>
      <div class="nav-sep"></div>
      <div class="nav-label">SERVERS</div>
      <div id="sidebarServerList">
        <div class="nav-item nav-placeholder">No servers</div>
      </div>
      <button class="nav-item nav-add-srv" onclick="showAddServer()">+ Add Server</button>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h2 class="page-title" id="pageTitle">Projects</h2>
      </div>
      <div class="topbar-right">
        <div id="topActions"></div>
        <div id="serverMiniBar" style="display:none;align-items:center;gap:6px">
          <span id="selServerName" style="font-size:13px;font-weight:600;color:#333"></span>
          <span id="selServerBadge" class="badge badge-stopped">STOPPED</span>
        </div>
      </div>
    </header>

    <div id="serverTabBar" class="server-tab-bar" style="display:none">
      <div id="serverTabs" class="server-tabs"></div>
      <button class="server-tab-add" onclick="showAddServer()" title="Add Server">+</button>
    </div>

    <div class="content">

      <div id="projectsPanel" class="panel active">
        <div id="projectListView">
          <div class="row" style="margin-bottom:16px">
            <button class="btn btn-start" onclick="showAddProject()">+ Add Project</button>
          </div>
          <div id="projectsGrid" class="card-grid"></div>
        </div>

        <div id="projectDetailView" style="display:none">
          <div class="row" style="margin-bottom:8px">
            <button class="btn btn-secondary btn-sm" onclick="closeProjectDetail()">← Back to projects</button>
            <h3 id="pdTitle" style="margin:0 0 0 12px;font-size:16px;flex:1"></h3>
            <button class="btn btn-sm btn-secondary" onclick="showEditProjectFromDetail()">Edit</button>
            <button class="btn btn-sm btn-stop" onclick="confirmDeleteProjectById()">Delete</button>
          </div>
          <div id="pdMeta" style="font-size:13px;color:#555;margin-bottom:12px"></div>
          <div id="pdLinkedServers" style="font-size:12px;color:#555;margin-bottom:8px;padding:6px 10px;background:#f5f5f5;border-radius:4px;display:none"></div>

          <div id="pdCreateArea" class="md-card" style="margin-bottom:8px">
            <div class="row" style="gap:8px;flex-wrap:wrap">
              <input id="pdCreateName" placeholder="Modpack name" style="flex:2;min-width:150px;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
              <input id="pdCreateDesc" placeholder="Description" style="flex:3;min-width:200px;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
              <input id="pdCreateVer" placeholder="Version" value="1.0" style="flex:1;min-width:70px;width:70px;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
              <input id="pdCreateMcVer" placeholder="MC version, e.g. 1.20.1" style="flex:2;min-width:140px;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
              <select id="pdCreateLoader" style="flex:1;min-width:100px;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
                <option value="">Vanilla</option>
                <option value="forge">Forge</option>
                <option value="fabric">Fabric</option>
                <option value="quilt">Quilt</option>
                <option value="neoforge">NeoForge</option>
              </select>
              <input id="pdCreateLoaderVer" placeholder="Loader version" style="flex:1;min-width:100px;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
              <button class="btn btn-start btn-sm" onclick="confirmCreateModpack()">Create</button>
            </div>
          </div>

          <div id="pdMpCards" class="card-grid" style="margin-bottom:12px"></div>

          <div id="pdMpDetail" class="md-card" style="display:none">
            <div class="row" style="margin-bottom:8px">
              <h4 id="pdMpDetailTitle" style="margin:0;font-size:15px"></h4>
              <button class="btn btn-secondary btn-sm" onclick="closeMpDetail()">Back to modpacks</button>
            </div>
            <div id="pdMpDetailMeta" style="font-size:13px;color:#555;margin-bottom:8px"></div>
            <div id="pdMpLinkedServers" style="font-size:12px;color:#555;margin-bottom:8px;padding:6px 10px;background:#f5f5f5;border-radius:4px;display:none"></div>
            <div class="server-sub-nav">
              <button class="sub-nav-item active" data-mp-subtab="files" onclick="switchMpSubTab('files')">Files</button>
              <button class="sub-nav-item" data-mp-subtab="mods" onclick="switchMpSubTab('mods')">Mods</button>
            </div>
            <div id="pdMpFilesView" class="server-sub-panel active">
              <div class="file-toolbar">
                <span id="pdMpDir" class="dir-display" style="margin-bottom:0;flex:1;padding:6px 12px;font-size:12px"></span>
                <div class="upload-btn">
                  <button class="btn btn-start btn-sm">Upload File</button>
                  <input type="file" id="pdMpUploadInput" onchange="uploadMpFile(this)" multiple>
                </div>
                <button class="btn btn-primary btn-sm" onclick="document.getElementById('pdMpImportInput').click()" style="margin-left:8px">Import Modpack</button>
                <input type="file" id="pdMpImportInput" accept=".zip,.mrpack" style="display:none" onchange="importMpArchive(this)">
                <button class="btn btn-secondary btn-sm" onclick="document.getElementById('pdMpExtractInput').click()">Extract ZIP</button>
                <input type="file" id="pdMpExtractInput" accept=".zip,.mrpack" style="display:none" onchange="extractMpArchive(this)">
                <label style="font-size:12px;color:#888;display:flex;align-items:center;gap:4px;margin-left:4px">
                  <input type="checkbox" id="pdMpExtractClear"> Clear first
                </label>
              </div>
              <div id="pdMpImportStatus" style="font-size:12px;color:#888;padding:4px 0;display:none"></div>
              <div id="pdMpFileList"></div>
            </div>
            <div id="pdMpModsView" class="server-sub-panel">
              <div id="pdMpModsList"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="serversPanel" class="panel">
        <div id="serverEmptyView">
          <div style="padding:32px;text-align:center;color:#888">Select a server from the sidebar or add one</div>
        </div>
        <div id="serverDetailView" style="display:none">
          <div class="row" style="margin-bottom:12px">
            <h2 id="serverDetailTitle" style="font-size:18px;font-weight:500;margin:0">Server</h2>
            <span id="serverDetailBadge" class="badge badge-stopped">STOPPED</span>
            <span id="serverDetailPid" style="font-size:12px;color:#888;font-family:monospace;margin-left:4px"></span>
            <span id="serverDetailModpack" style="font-size:12px;margin-left:8px;padding:2px 8px;background:#e8f5e9;border-radius:4px;display:none"></span>
            <div style="margin-left:auto;display:flex;gap:6px">
              <button class="btn btn-start btn-sm" onclick="serverAction('start')" id="detailBtnStart">Start</button>
              <button class="btn btn-stop btn-sm" onclick="serverAction('stop')" id="detailBtnStop" disabled>Stop</button>
              <button class="btn btn-restart btn-sm" onclick="serverAction('restart')" id="detailBtnRestart">Restart</button>
              <button class="btn btn-secondary btn-sm" onclick="installServerModpack()" id="detailBtnInstallModpack">Install Modpack</button>
              <button class="btn btn-secondary btn-sm" onclick="syncServerWhitelist()" id="detailBtnSyncWhitelist">Sync Whitelist</button>
            </div>
          </div>
          <div class="server-sub-nav">
            <button class="sub-nav-item active" data-subtab="console" onclick="switchServerSubTab('console')">Console</button>
            <button class="sub-nav-item" data-subtab="settings" onclick="switchServerSubTab('settings')">Settings</button>
            <button class="sub-nav-item" data-subtab="files" onclick="switchServerSubTab('files')">Files</button>
          </div>
          <div id="serverConsoleView" class="server-sub-panel active">
            <div class="console-wrap server-console-wrap">
              <div class="console-toolbar">
                <button class="btn-text" id="consolePauseBtn" onclick="toggleConsolePause()">Pause</button>
                <button class="btn-text active" id="consoleScrollBtn" onclick="toggleConsoleScroll()">Scroll</button>
                <span class="sep"></span>
                <button class="btn-text" onclick="consoleFontSize(-1)">A-</button>
                <button class="btn-text" onclick="consoleFontSize(1)">A+</button>
                <span class="sep"></span>
                <button class="btn-text" onclick="clearServerConsole()">Clear</button>
                <div class="console-search">
                  <input id="consoleSearchInput" placeholder="Search..." oninput="searchServerConsole()">
                  <span class="search-count" id="consoleSearchCount"></span>
                </div>
              </div>
              <div id="serverConsoleOutput"></div>
              <div class="console-bottom">
                <input id="consoleCmdInput" placeholder="Type a command..." onkeydown="handleConsoleCmdKey(event)">
                <button class="btn-text" onclick="sendServerCommand()">Send</button>
              </div>
            </div>
          </div>
          <div id="serverSettingsView" class="server-sub-panel">
            <form id="serverSettingsForm" onsubmit="saveServerSettings(event)"></form>
          </div>
          <div id="serverFilesView" class="server-sub-panel">
            <div class="file-toolbar" style="margin-top:0">
              <span id="serverFilesDir" class="dir-display" style="margin-bottom:0;flex:1;padding:6px 12px;font-size:12px"></span>
              <div class="upload-btn">
                <button class="btn btn-start btn-sm">Upload File</button>
                <input type="file" id="serverFilesUpload" onchange="uploadServerFile(this)" multiple>
              </div>
            </div>
            <div id="serverFilesBrowser"></div>
          </div>
        </div>
      </div>

      <div id="playersPanel" class="panel">
        <table>
          <thead><tr><th>ID</th><th>Username</th><th>Name</th><th>Email</th><th>Created</th></tr></thead>
          <tbody id="playersBody"></tbody>
        </table>
      </div>

      <div id="configPanel" class="panel">
        <form id="configForm" onsubmit="saveGlobalConfig(event)"></form>
      </div>

      <div id="javaPanel" class="panel">
        <div class="row">
          <button class="btn btn-start" onclick="scanJava()">Scan Java</button>
          <span id="javaScanStatus" class="status-text"></span>
        </div>
        <table>
          <thead><tr><th>Major</th><th>Version</th><th>Vendor</th><th>Arch</th><th>Path</th></tr></thead>
          <tbody id="javaBody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<div id="addProjectModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>Add Project</h2>
    <div class="md-field">
      <label>Project ID</label>
      <input id="projId" placeholder="e.g. technic">
    </div>
    <div class="md-field">
      <label>Project Name</label>
      <input id="projName" placeholder="e.g. Technic">
    </div>
    <div class="md-field">
      <label>Description</label>
      <input id="projDesc" placeholder="Modpack description">
    </div>
    <fieldset style="border:1px solid #ddd;border-radius:6px;padding:12px;margin-top:8px">
      <legend style="font-size:12px;font-weight:600;color:#666">Branding</legend>
      <div class="md-field">
        <label>Brand Name</label>
        <input id="projBrand" placeholder="Display name override">
      </div>
      <div class="md-field">
        <label>Window Title</label>
        <input id="projWindowTitle" placeholder="Launcher window title">
      </div>
      <div class="md-field">
        <label>Primary Color</label>
        <input id="projColor" placeholder="#6c63ff" value="#6c63ff">
      </div>
      <div class="md-field">
        <label>Accent Color</label>
        <input id="projAccent" placeholder="Optional accent color">
      </div>
      <div class="md-field">
        <label>Logo URL</label>
        <input id="projLogo" placeholder="https://example.com/logo.png">
      </div>
      <div class="md-field">
        <label>Background URL</label>
        <input id="projBg" placeholder="https://example.com/bg.png">
      </div>
    </fieldset>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('addProjectModal')">Cancel</button>
      <button class="btn btn-start" onclick="confirmAddProject()">Create</button>
    </div>
  </div>
</div>

<div id="editProjectModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>Edit Project</h2>
    <div class="md-field">
      <label>Project Name</label>
      <input id="editProjName" placeholder="Project name">
    </div>
    <div class="md-field">
      <label>Description</label>
      <input id="editProjDesc" placeholder="Description">
    </div>
    <fieldset style="border:1px solid #ddd;border-radius:6px;padding:12px;margin-top:8px">
      <legend style="font-size:12px;font-weight:600;color:#666">Branding</legend>
      <div class="md-field">
        <label>Brand Name</label>
        <input id="editProjBrand" placeholder="Display name override">
      </div>
      <div class="md-field">
        <label>Window Title</label>
        <input id="editProjWindowTitle" placeholder="Launcher window title">
      </div>
      <div class="md-field">
        <label>Primary Color</label>
        <input id="editProjColor" placeholder="#6c63ff">
      </div>
      <div class="md-field">
        <label>Accent Color</label>
        <input id="editProjAccent" placeholder="Optional accent color">
      </div>
      <div class="md-field">
        <label>Logo URL</label>
        <input id="editProjLogo" placeholder="https://example.com/logo.png">
      </div>
      <div class="md-field">
        <label>Background URL</label>
        <input id="editProjBg" placeholder="https://example.com/bg.png">
      </div>
    </fieldset>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('editProjectModal')">Cancel</button>
      <button class="btn btn-start" onclick="confirmEditProject()">Save</button>
      <button class="btn btn-stop" onclick="confirmDeleteProjectModal()" style="margin-left:auto">Delete</button>
    </div>
  </div>
</div>

<div id="editModpackModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>Edit Modpack</h2>
    <div class="md-field">
      <label>Name</label>
      <input id="editMpName">
    </div>
    <div class="md-field">
      <label>Description</label>
      <input id="editMpDesc">
    </div>
    <div class="md-field">
      <label>Version</label>
      <input id="editMpVer">
    </div>
    <div class="md-field">
      <label>MC Version</label>
      <input id="editMpMcVer" placeholder="e.g. 1.20.1">
    </div>
    <div class="md-field">
      <label>Mod Loader</label>
      <select id="editMpLoader" style="width:100%;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
        <option value="">Vanilla</option>
        <option value="forge">Forge</option>
        <option value="fabric">Fabric</option>
        <option value="quilt">Quilt</option>
        <option value="neoforge">NeoForge</option>
      </select>
    </div>
    <div class="md-field">
      <label>Loader Version</label>
      <input id="editMpLoaderVer">
    </div>
    <div class="md-field">
      <label>Changelog</label>
      <textarea id="editMpChangelog" rows="3" style="width:100%;padding:8px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif;resize:vertical"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('editModpackModal')">Cancel</button>
      <button class="btn btn-start" onclick="confirmEditModpack()">Save</button>
      <button class="btn btn-stop" onclick="confirmDeleteModpack()" style="margin-left:auto">Delete</button>
    </div>
  </div>
</div>

<div id="addServerModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2>Add Server</h2>
    <div class="md-field">
      <label>Server ID</label>
      <input id="newServerId" placeholder="e.g. my-server">
    </div>
    <div class="md-field">
      <label>Display Name</label>
      <input id="newServerName" placeholder="e.g. My Server">
    </div>
    <div class="md-field">
      <label>Project</label>
      <select id="newServerProject" onchange="onNewServerProjectChange()" style="width:100%;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
        <option value="">(None)</option>
      </select>
    </div>
    <div class="md-field">
      <label>Modpack</label>
      <select id="newServerModpack" style="width:100%;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
        <option value="">(None)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('addServerModal')">Cancel</button>
      <button class="btn btn-start" onclick="confirmAddServer()">Create</button>
    </div>
  </div>
</div>

<script src="/admin/static/admin.js?v=3"></script>
</body>
</html>
